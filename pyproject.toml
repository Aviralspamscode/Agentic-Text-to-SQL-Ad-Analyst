[project]
name = "agentic-text-to-sql-ad-analyst"
version = "0.1.0"
description = "LangGraph text-to-SQL analyst over the Criteo warehouse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.6",
    "langgraph>=1.2.12",
    "openai>=3.23.0",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "ruff>=0.16.10",
    "sqlglot>=30.21.0",
    "streamlit>=1.64.0",
]

[tool.uv]
package = false
