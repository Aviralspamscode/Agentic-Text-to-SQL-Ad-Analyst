# Eval set. H1–H10 are reserved for the user's hard/medium items.
# verified: true only after manual sign-off.

questions:
  - id: E01
    tier: easy
    verified: true
    key_columns: [n_campaigns]
    notes: distinct campaign labels
    question: How many distinct campaigns ran in this log?
    gold_sql: |
      SELECT COUNT(DISTINCT CAST(campaign AS VARCHAR)) AS n_campaigns
      FROM impressions

  - id: E02
    tier: easy
    verified: true
    key_columns: [click_share]
    notes: CTR from sums
    question: What fraction of all ad displays were actually clicked?
    gold_sql: |
      SELECT SUM(click) * 1.0 / COUNT(*) AS click_share
      FROM impressions

  - id: E03
    tier: easy
    verified: true
    key_columns: [touch_count]
    notes: mode journey length
    question: What converting-journey length shows up most often?
    gold_sql: |
      SELECT touch_count, n_journeys, share
      FROM journey_length_distribution
      ORDER BY n_journeys DESC
      LIMIT 1

  - id: E04
    tier: easy
    verified: true
    key_columns: [n_segments]
    notes: segment count
    question: How many contextual segments do we report on?
    gold_sql: |
      SELECT COUNT(DISTINCT CAST(unit AS VARCHAR)) AS n_segments
      FROM segment_economics
      WHERE period = 'full'

  - id: E05
    tier: easy
    verified: true
    key_columns: [unit]
    notes: impression share leader
    question: In the full period, which contextual segment is in front of the most displays?
    gold_sql: |
      SELECT CAST(unit AS VARCHAR) AS unit, impression_share
      FROM segment_economics
      WHERE period = 'full'
      ORDER BY impression_share DESC
      LIMIT 1

  - id: E06
    tier: easy
    verified: true
    key_columns: [n_advertiser_credited]
