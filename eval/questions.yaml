  - id: M09
    tier: medium
    verified: true
    key_columns: [n_over]
    notes: "DEFAULT scope = all conversions; named; last vs linear from journeys"
    question: How many named segments does last-click over-credit by more than 10%?
    gold_sql: |
      WITH cred AS (
        SELECT
          CAST(unit AS VARCHAR) AS unit,
          SUM(is_last) AS last_credit,
          SUM(1.0 / touch_count) AS linear_credit
        FROM journeys_converting
        GROUP BY 1
      )
      SELECT COUNT(*) AS n_over
      FROM cred
      WHERE unit <> 'other'
        AND (last_credit - linear_credit) / linear_credit > 0.10

  - id: M10
    tier: medium
    verified: true
    key_columns: [view_spend_share]
    notes: "BASE impressions"
    question: What share of spend is going to displays nobody clicked?
    gold_sql: |
