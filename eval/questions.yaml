  - id: E07
    tier: easy
    verified: true
    key_columns: [n_users]
    notes: unique users on converting click paths
    question: How many people appear on a converting click path?
    gold_sql: |
      SELECT COUNT(DISTINCT CAST(uid AS VARCHAR)) AS n_users
      FROM journeys_converting

  - id: E08
    tier: easy
    verified: true
    notes: recency descriptive
    question: How soon before converting do people make their final click? Break it down by time bucket.
    gold_sql: |
      SELECT recency_bucket, COUNT(*) AS n_last_clicks
      FROM journeys_converting
      WHERE is_last = 1
      GROUP BY recency_bucket
      ORDER BY CASE recency_bucket
        WHEN '<1h' THEN 1 WHEN '1-24h' THEN 2 WHEN '1-7d' THEN 3 WHEN '7-30d' THEN 4 ELSE 5
      END

  - id: E09
    tier: easy
    verified: true
    key_columns: [n_views]
