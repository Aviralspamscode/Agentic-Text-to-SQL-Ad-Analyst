  - id: M05
    tier: medium
    verified: true
    key_columns: [share_switch]
    notes: "BASE journeys_converting: first vs last unit"
    question: What share of converting paths start and finish on different segments?
    gold_sql: |
      WITH ends AS (
        SELECT
          conversion_id,
          MAX(CASE WHEN is_first = 1 THEN CAST(unit AS VARCHAR) END) AS first_unit,
          MAX(CASE WHEN is_last = 1 THEN CAST(unit AS VARCHAR) END) AS last_unit
        FROM journeys_converting
        GROUP BY conversion_id
      )
      SELECT AVG(CASE WHEN first_unit <> last_unit THEN 1.0 ELSE 0.0 END) AS share_switch
      FROM ends

  - id: M06
    tier: medium
    verified: true
    key_columns: [unit]
    notes: "METRIC: first-half CPA"
    question: In the first two weeks, which named segment looks most expensive?
    gold_sql: |
      SELECT CAST(unit AS VARCHAR) AS unit, cpa_index_adv_linear
      FROM segment_economics
      WHERE period = 'days_1_15' AND unit <> 'other' AND low_confidence_adv_linear = 0
