  - id: M04
    tier: medium
    verified: true
    key_columns: [unit]
    notes: "METRIC: last vs linear on ALL conversions, named only (not the multi-touch smoke question)"
    question: Which named segment does last-click flatter the most versus splitting credit evenly?
    gold_sql: |
      SELECT CAST(unit AS VARCHAR) AS unit, pct_diff_last_vs_linear
      FROM attr_compare
      WHERE scope = 'all' AND unit <> 'other'
