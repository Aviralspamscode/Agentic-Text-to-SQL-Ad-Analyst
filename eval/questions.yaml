  - id: H1
    tier: hard
    verified: true
    key_columns: [unit]
    notes: "Gold |ΔCPA/default CPA|. Ranking last vs linear is identical (LEARNING)."
    question: Which specific segment's cost per credited conversion changes the most, in percentage terms, if we judge it by last-click credit instead of our standard credit split?
    gold_sql: |
      SELECT
        CAST(unit AS VARCHAR) AS unit,
        ABS(
          (cpa_index_adv_last - cpa_index_adv_linear) / cpa_index_adv_linear
        ) AS abs_pct_change
      FROM segment_economics
      WHERE period = 'full'
        AND unit <> 'other'
        AND low_confidence_adv_linear = 0
      ORDER BY abs_pct_change DESC
      LIMIT 1

  - id: H2
    tier: hard
    verified: true
    notes: "Largest = most impressions. Even-split = 1/touch_count. Shares among journeys of that length."
    question: How much of the even-split conversion credit does our largest segment get on paths of five or more clicks, versus single-click paths?
    gold_sql: |
      WITH largest AS (
        SELECT CAST(unit AS VARCHAR) AS unit
        FROM impressions_unit
        GROUP BY 1
        ORDER BY COUNT(*) DESC
        LIMIT 1
      )
      SELECT
        SUM(CASE WHEN j.touch_count >= 5 AND CAST(j.unit AS VARCHAR) = l.unit THEN 1.0 / j.touch_count ELSE 0 END)
          / COUNT(DISTINCT CASE WHEN j.touch_count >= 5 THEN j.conversion_id END) AS share_long,
        SUM(CASE WHEN j.touch_count = 1 AND CAST(j.unit AS VARCHAR) = l.unit THEN 1.0 / j.touch_count ELSE 0 END)
          / COUNT(DISTINCT CASE WHEN j.touch_count = 1 THEN j.conversion_id END) AS share_single
      FROM journeys_converting j
      CROSS JOIN largest l

  - id: H3
    tier: hard
    verified: true
    key_columns: [unit]
    notes: "Credit rate = last-touch unit vs pooled book rate. Cheaper = default CPA < 1."
    question: Which named segments are both credited by the advertiser more often than average and cheaper per credited conversion than average?
    gold_sql: |
      WITH last_unit AS (
        SELECT conversion_id, CAST(unit AS VARCHAR) AS unit
        FROM journeys_converting
        WHERE is_last = 1
      ),
      flags AS (
        SELECT conversion_id, MAX(attribution) AS is_advertiser_credited
        FROM journeys_converting
        GROUP BY conversion_id
      ),
      book AS (
        SELECT AVG(CAST(is_advertiser_credited AS DOUBLE)) AS book_rate
        FROM flags
      ),
      rates AS (
        SELECT
          u.unit,
          AVG(CAST(f.is_advertiser_credited AS DOUBLE)) AS credit_rate
        FROM last_unit u
        JOIN flags f USING (conversion_id)
        GROUP BY u.unit
      )
      SELECT CAST(r.unit AS VARCHAR) AS unit
      FROM rates r
      CROSS JOIN book b
      JOIN segment_economics e ON e.unit = r.unit AND e.period = 'full'
      WHERE r.unit <> 'other'
        AND r.credit_rate > b.book_rate
        AND e.cpa_index_adv_linear < 1
        AND e.low_confidence_adv_linear = 0

  - id: H4
    tier: hard
    verified: true
    notes: "Journey-level MAX(attribution); pooled rates by path length."
    question: Are conversions that took five or more clicks credited to us by the advertiser more or less often than single-click conversions?
    gold_sql: |
      WITH flags AS (
        SELECT
          conversion_id,
          ANY_VALUE(touch_count) AS touch_count,
          MAX(attribution) AS is_advertiser_credited
        FROM journeys_converting
        GROUP BY conversion_id
      )
      SELECT
        AVG(CASE WHEN touch_count >= 5 THEN CAST(is_advertiser_credited AS DOUBLE) END) AS rate_long,
        AVG(CASE WHEN touch_count = 1 THEN CAST(is_advertiser_credited AS DOUBLE) END) AS rate_single
      FROM flags

  - id: H5
    tier: hard
    verified: true
    notes: "View spend / segment spend; other vs all named combined."
    question: How does the share of spend going to unclicked displays in the catch-all bucket compare with the named segments combined?
    gold_sql: |
      SELECT
        SUM(CASE WHEN CAST(unit AS VARCHAR) = 'other' AND click = 0 THEN cost ELSE 0 END)
          / SUM(CASE WHEN CAST(unit AS VARCHAR) = 'other' THEN cost END) AS view_spend_share_other,
        SUM(CASE WHEN CAST(unit AS VARCHAR) <> 'other' AND click = 0 THEN cost ELSE 0 END)
          / SUM(CASE WHEN CAST(unit AS VARCHAR) <> 'other' THEN cost END) AS view_spend_share_named
      FROM impressions_unit

  - id: H6
    tier: hard
    verified: true
    key_columns: [unit]
    notes: "Default CPA days_16_30 vs days_1_15; (second-first)/first; named, confident both halves."
    question: Which specific segment's cost per credited conversion got worse the most, in percentage terms, from the first half of the month to the second?
    gold_sql: |
      SELECT CAST(a.unit AS VARCHAR) AS unit,
             (b.cpa_index_adv_linear - a.cpa_index_adv_linear)
               / a.cpa_index_adv_linear AS pct_worse
      FROM segment_economics a
      JOIN segment_economics b ON a.unit = b.unit
      WHERE a.period = 'days_1_15'
        AND b.period = 'days_16_30'
        AND a.unit <> 'other'
        AND a.low_confidence_adv_linear = 0
        AND b.low_confidence_adv_linear = 0
      ORDER BY pct_worse DESC
      LIMIT 1

  - id: H7
    tier: hard
    verified: true
    key_columns: [unit, share]
    notes: "Donors in reallocation_plan; view cost / unit cost on impressions_unit."
    question: For each segment we plan to take budget from, what share of its spend goes on displays that were never clicked?
    gold_sql: |
      SELECT
        CAST(p.unit AS VARCHAR) AS unit,
        SUM(CASE WHEN i.click = 0 THEN i.cost ELSE 0 END) / SUM(i.cost) AS share
      FROM reallocation_plan p
      JOIN impressions_unit i ON CAST(i.unit AS VARCHAR) = CAST(p.unit AS VARCHAR)
      WHERE p.role = 'donor'
      GROUP BY p.unit

  - id: H8
    tier: hard
    verified: true
    key_columns: [unit]
    notes: "Median (conversion_timestamp - first-click timestamp) by first-click unit; named only."
    question: Which specific segment's converting paths take the longest from first click to conversion, judged by the median path? Attribute each path to its first-click segment.
    gold_sql: |
      SELECT
        CAST(unit AS VARCHAR) AS unit,
        MEDIAN(conversion_timestamp - timestamp) AS median_seconds
      FROM journeys_converting
      WHERE is_first = 1
        AND CAST(unit AS VARCHAR) <> 'other'
      GROUP BY 1
      ORDER BY median_seconds DESC
      LIMIT 1

  - id: H9
    tier: hard
    verified: true
    key_columns: [share_to_below_average_credit]
    notes: "Share of planned inbound budget on receivers with last-touch credit rate below pooled book rate."
    question: Of the budget we plan to move onto receiving segments, what share goes to segments where the advertiser credits us less often than average?
    gold_sql: |
      WITH last_unit AS (
        SELECT conversion_id, CAST(unit AS VARCHAR) AS unit
        FROM journeys_converting
        WHERE is_last = 1
      ),
      flags AS (
        SELECT conversion_id, MAX(attribution) AS is_advertiser_credited
        FROM journeys_converting
        GROUP BY conversion_id
      ),
      book AS (
        SELECT AVG(CAST(is_advertiser_credited AS DOUBLE)) AS book_rate
        FROM flags
      ),
      rates AS (
        SELECT
          u.unit,
          AVG(CAST(f.is_advertiser_credited AS DOUBLE)) AS credit_rate
        FROM last_unit u
        JOIN flags f USING (conversion_id)
        GROUP BY u.unit
      ),
      moved AS (
        SELECT
          CAST(p.unit AS VARCHAR) AS unit,
          p.spend_frac_change * e.spend_share AS moved_share
        FROM reallocation_plan p
        JOIN segment_economics e ON e.unit = p.unit AND e.period = 'full'
        WHERE p.role = 'receiver'
      )
      SELECT
        SUM(CASE WHEN r.credit_rate < b.book_rate THEN m.moved_share ELSE 0 END)
          / SUM(m.moved_share) AS share_to_below_average_credit
      FROM moved m
      JOIN rates r USING (unit)
      CROSS JOIN book b

  - id: H10
    tier: hard
    verified: true
    key_columns: [unit]
    notes: "Uncredited = MAX(attribution)=0; multi-click; last-touch unit; named only."
    question: On multi-click conversions the advertiser didn't credit to us, which specific segment most often had the final click?
    gold_sql: |
      WITH uncred AS (
        SELECT conversion_id
        FROM journeys_converting
        GROUP BY conversion_id
        HAVING MAX(attribution) = 0
           AND ANY_VALUE(touch_count) >= 2
      )
      SELECT CAST(j.unit AS VARCHAR) AS unit, COUNT(*) AS n_last
      FROM journeys_converting j
      JOIN uncred u USING (conversion_id)
      WHERE j.is_last = 1
        AND CAST(j.unit AS VARCHAR) <> 'other'
      GROUP BY 1
      ORDER BY n_last DESC
      LIMIT 1
