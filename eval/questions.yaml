  - id: X01
    tier: hard
    verified: true
    key_columns: [unit]
    notes: "BASE impressions_unit + journeys; DEFAULT CPA = adv x linear; absolute share gap"
    question: In absolute terms, which specific segment's share of spend most exceeds its share of credited conversions?
    gold_sql: |
      WITH spend AS (
        SELECT CAST(unit AS VARCHAR) AS unit, SUM(cost) AS spend
        FROM impressions_unit
        GROUP BY 1
      ),
      cred AS (
        SELECT CAST(unit AS VARCHAR) AS unit, SUM(1.0 / touch_count) AS credit
        FROM journeys_converting
        WHERE conversion_id IN (
          SELECT conversion_id
          FROM journeys_converting
          GROUP BY conversion_id
          HAVING MAX(attribution) = 1
        )
        GROUP BY 1
      ),
      shares AS (
        SELECT
          s.unit,
          s.spend / SUM(s.spend) OVER () AS spend_share,
          c.credit / SUM(c.credit) OVER () AS conv_share
        FROM spend s
        JOIN cred c USING (unit)
      )
      SELECT unit, spend_share - conv_share AS spend_minus_credit_share
      FROM shares
      WHERE unit <> 'other'
      ORDER BY spend_minus_credit_share DESC
      LIMIT 1

  - id: X02
    tier: hard
    verified: true
    notes: "BASE journeys_converting + impressions_unit"
    question: For people with more than one touch, how biased is last-click on each named segment, and how much budget does each eat?
    gold_sql: |
      WITH bias AS (
        SELECT
          CAST(unit AS VARCHAR) AS unit,
          SUM(is_last) AS last_credit,
          SUM(1.0 / touch_count) AS linear_credit
        FROM journeys_converting
        WHERE touch_count >= 2
        GROUP BY 1
      ),
      spend AS (
        SELECT CAST(unit AS VARCHAR) AS unit, SUM(cost) AS spend
        FROM impressions_unit
        GROUP BY 1
      ),
      shares AS (
        SELECT
          b.unit,
          (b.last_credit - b.linear_credit) / b.linear_credit AS pct_diff_last_vs_linear,
          s.spend / SUM(s.spend) OVER () AS spend_share
        FROM bias b
        JOIN spend s USING (unit)
      )
      SELECT unit, pct_diff_last_vs_linear, spend_share
      FROM shares
      WHERE unit <> 'other'
      ORDER BY pct_diff_last_vs_linear DESC

  - id: X03
    tier: hard
    verified: true
    key_columns: [unit]
    notes: "BASE journeys_converting; key is the segment label"
    question: Which segment swings the most from first-click credit to last-click credit?
    gold_sql: |
      SELECT
        CAST(unit AS VARCHAR) AS unit,
        SUM(is_last) - SUM(is_first) AS last_minus_first
      FROM journeys_converting
      GROUP BY 1
      ORDER BY ABS(SUM(is_last) - SUM(is_first)) DESC
      LIMIT 1

  - id: X04
    tier: hard
    verified: true
    notes: "BASE journeys_converting"
    question: On conversions the advertiser actually paid us for, how do even-split and last-click credit compare by segment?
    gold_sql: |
      SELECT
        CAST(unit AS VARCHAR) AS unit,
        SUM(1.0 / touch_count) AS linear_credited,
        SUM(is_last) AS last_credited
      FROM journeys_converting
      WHERE conversion_id IN (
        SELECT conversion_id
        FROM journeys_converting
        GROUP BY conversion_id
        HAVING MAX(attribution) = 1
      )
      GROUP BY 1
      ORDER BY linear_credited DESC

  - id: X05
    tier: hard
    verified: true
    key_columns: [share_end_elsewhere]
    notes: "Denominator = multi-touch paths that start on the largest impression segment"
    question: Of multi-touch paths that start on our largest segment, what share end on a different one?
    gold_sql: |
      WITH largest AS (
        SELECT CAST(unit AS VARCHAR) AS unit
        FROM impressions_unit
        GROUP BY 1
        ORDER BY COUNT(*) DESC
        LIMIT 1
      ),
      first_last AS (
        SELECT
          conversion_id,
          MAX(CASE WHEN is_first = 1 THEN CAST(unit AS VARCHAR) END) AS first_unit,
          MAX(CASE WHEN is_last = 1 THEN CAST(unit AS VARCHAR) END) AS last_unit
        FROM journeys_converting
        WHERE touch_count >= 2
        GROUP BY conversion_id
      )
      SELECT
        AVG(CASE WHEN last_unit <> first_unit THEN 1.0 ELSE 0.0 END) AS share_end_elsewhere
      FROM first_last
      JOIN largest ON first_unit = largest.unit

  - id: X06
    tier: hard
    verified: true
    notes: "JOIN plan to economics"
    question: For the segments we're planning to move money between, what's each one's cost per credited conversion?
    gold_sql: |
      SELECT
        CAST(p.unit AS VARCHAR) AS unit,
        p.role,
        e.cpa_index_adv_linear
      FROM reallocation_plan p
      JOIN segment_economics e ON p.unit = e.unit AND e.period = 'full'
      ORDER BY p.role, e.cpa_index_adv_linear DESC

  - id: X07
    tier: hard
    verified: true
    key_columns: [period, unit]
    notes: "WINDOW: top expensive named segment per half"
    question: In each half of the month, which named segment looks most expensive?
    gold_sql: |
      SELECT period, CAST(unit AS VARCHAR) AS unit, cpa_index_adv_linear
      FROM segment_economics
      WHERE period IN ('days_1_15', 'days_16_30')
        AND unit <> 'other'
        AND low_confidence_adv_linear = 0
      QUALIFY ROW_NUMBER() OVER (PARTITION BY period ORDER BY cpa_index_adv_linear DESC) = 1

