  - id: M07
    tier: medium
    verified: true
    key_columns: [unit]
    notes: "DEFAULT credit-rate = last-touch unit (P1.7); specific/named"
    question: Which specific segment does the advertiser credit us least often on?
    gold_sql: |
      WITH last_unit AS (
        SELECT conversion_id, CAST(unit AS VARCHAR) AS unit
        FROM journeys_converting
        WHERE is_last = 1
      ),
      flags AS (
        SELECT conversion_id, MAX(attribution) AS is_advertiser_credited
        FROM journeys_converting
        GROUP BY conversion_id
      )
      SELECT
        u.unit,
        AVG(CAST(f.is_advertiser_credited AS DOUBLE)) AS share_advertiser_credited
      FROM last_unit u
      JOIN flags f USING (conversion_id)
      WHERE u.unit <> 'other'
      GROUP BY u.unit
      ORDER BY share_advertiser_credited ASC
      LIMIT 1

  - id: M08
    tier: medium
    verified: true
    key_columns: [linear_conv_share]
    notes: "BASE journeys_converting linear credit"
    question: What fraction of even-split conversion credit goes to the catch-all segment?
    gold_sql: |
      SELECT
        SUM(CASE WHEN CAST(unit AS VARCHAR) = 'other' THEN 1.0 / touch_count ELSE 0 END)
        / COUNT(DISTINCT conversion_id) AS linear_conv_share
